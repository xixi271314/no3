<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火箭运输决策局 · 互联网数据传输模拟</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">火箭运输决策局</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">T+ 0.0s</span>
      <button class="ghost-btn" id="btn-home">返回方案选择</button>
    </div>
  </header>

  <!-- ===== 视图：开始页 ===== -->
  <section class="view" id="view-home">
    <div class="hero">
      <div class="hero-eyebrow">七年级信息科技 · 第5课 探索互联网传输</div>
      <h1 class="hero-title">你是一名<span class="hl">运输决策员</span></h1>
      <p class="hero-desc">
        一座火箭工厂要把一枚大型火箭运往发射场。与此同时，隔壁货运站也有列车要出发，线路十分紧张。
        作为决策员，请从下面三种运输方案中选一种，亲眼看看它是怎么跑的、快不快、会不会堵。
      </p>
      <div class="hero-cards" id="mode-cards"></div>
    </div>
  </section>

  <!-- ===== 视图：调度看板（模拟） ===== -->
  <section class="view hidden" id="view-board">
    <div class="board-layout">
      <div class="board-main">
        <div class="board-head">
          <div>
            <div class="board-mode-tag" id="board-mode-tag">专线传输</div>
            <h2 class="board-title" id="board-title">建立专线，全程独占</h2>
          </div>
          <div class="board-actions">
            <div class="route-picker" id="route-picker" style="display:none">
              <span class="rp-label">① 先选要独占的专线</span>
              <div class="route-opts" id="route-opts"></div>
            </div>
            <button class="ghost-btn small" id="btn-pause">暂停</button>
            <button class="primary-btn small" id="btn-run">开始运输</button>
          </div>
        </div>

        <div class="svg-wrap">
          <svg id="board" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
            <g id="edges-layer"></g>
            <g id="nodes-layer"></g>
            <g id="tokens-layer"></g>
          </svg>
          <div class="board-legend">
            <span class="legend-item"><i class="dot me"></i>我的火箭模块</span>
            <span class="legend-item"><i class="dot rival"></i>货运站列车</span>
            <span class="legend-item"><i class="line idle"></i>空闲线路</span>
            <span class="legend-item"><i class="line busy"></i>占用中</span>
            <span class="legend-item"><i class="line locked"></i>专线锁定</span>
          </div>
        </div>

        <div class="reassemble" id="reassemble">
          <span class="reassemble-label">发射场接收台 · 模块到达顺序</span>
          <div class="reassemble-slots" id="reassemble-slots"></div>
        </div>
      </div>

      <aside class="board-side">
        <div class="side-block">
          <h3>调度日志</h3>
          <div class="log" id="log"></div>
        </div>
        <div class="side-block stats" id="side-stats">
          <div class="stat"><span class="stat-num" id="stat-time">0.0</span><span class="stat-label">用时(秒)</span></div>
          <div class="stat"><span class="stat-num" id="stat-parallel">0</span><span class="stat-label">并行列车数</span></div>
          <div class="stat"><span class="stat-num" id="stat-done">0/6</span><span class="stat-label">已送达模块</span></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ===== 视图：结果面板 ===== -->
  <section class="view hidden" id="view-result">
    <div class="result-card">
      <div class="result-mode-tag" id="result-mode-tag">专线传输</div>
      <h2 class="result-title" id="result-title">方案表现</h2>
      <div class="result-stats" id="result-stats"></div>
      <div class="result-verdict" id="result-verdict"></div>
      <div class="result-actions">
        <button class="ghost-btn" id="btn-retry">重跑本方案</button>
        <button class="primary-btn" id="btn-next-mode">换下一种方案</button>
      </div>
    </div>
  </section>

  <!-- ===== 视图：三方对比 ===== -->
  <section class="view hidden" id="view-compare">
    <div class="compare-card">
      <div class="hero-eyebrow">决策复盘</div>
      <h2 class="result-title">三种运输方式，到底该选谁？</h2>
      <div class="compare-table-wrap">
        <table class="compare-table" id="compare-table">
          <thead>
            <tr>
              <th>方案</th><th>用时</th><th>实时性</th><th>线路利用率</th><th>是否乱序</th><th>主要不足</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="conclusion" id="conclusion"></div>
      <div class="result-actions">
        <button class="primary-btn" id="btn-restart">再玩一轮</button>
      </div>
    </div>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
